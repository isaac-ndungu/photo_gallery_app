{% extends 'base.html' %}

{% block title %}Password Changed - The Vault{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-16 text-center">
    <div class="bg-white shadow-sm border border-gray-200 rounded-2xl p-8 sm:p-12 flex flex-col items-center">
        <!-- Success Icon -->
        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-green-50 border border-green-100 mb-6 text-green-500 shadow-sm">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <h2 class="text-2xl font-bold text-gray-900 mb-2">Password Updated!</h2>
        <p class="text-sm text-gray-500 mb-8 leading-relaxed">
            Your password has been changed successfully. You can now continue using all the features of your account.
        </p>

        <a href="{% url 'profile' %}" class="w-full inline-flex justify-center items-center gap-2 rounded-md bg-brand-500 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-600 transition-colors active:scale-95">
            <span>Back to Profile</span>
        </a>
    </div>
</div>
{% endblock %}
