{% extends 'base.html' %}

{% block title %}Home - The Vault{% endblock %}

{% block content %}
<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-16">

    <!-- Top Header & Filters -->
    <div class="mb-12">
        <!-- Subheading -->
        <div class="flex items-center gap-4 mb-4">
            <div class="h-[2px] w-12 bg-brand-500"></div>
            <span class="text-xs font-semibold tracking-[0.2em] text-gray-400 uppercase">Gallery</span>
        </div>

        <!-- Main Heading and Filter Nav -->
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
            <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-brand-500">
                Todas Las Fotos
            </h1>

            <nav
                class="flex flex-wrap items-center gap-6 text-xs font-semibold tracking-widest text-gray-400 uppercase border-b border-gray-200 pb-1 w-full md:w-auto">
                <a href="#"
                    class="text-brand-500 border-b-2 border-brand-500 pb-2 -mb-[3px] hover:text-brand-600 transition-colors">All</a>
                <a href="#" class="pb-2 -mb-[3px] hover:text-gray-900 transition-colors">Playas</a>
                <a href="#" class="pb-2 -mb-[3px] hover:text-gray-900 transition-colors">Océanos</a>
                <a href="#" class="pb-2 -mb-[3px] hover:text-gray-900 transition-colors">Los Bosques</a>
            </nav>
        </div>
    </div>

    <!-- Gallery Grid Placeholder (Empty State) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Placeholder Empty State -->
        <div class="col-span-full rounded-2xl border border-dashed border-gray-300 bg-white py-24 text-center">
            <div class="mx-auto max-w-sm flex flex-col items-center">
                <div
                    class="flex h-16 w-16 items-center justify-center rounded-xl bg-gray-50 border border-gray-100 mb-6 text-2xl shadow-sm text-gray-400">
                    <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                </div>
                <h3 class="text-lg font-semibold text-gray-900 mb-2">No photos uploaded yet</h3>
                <p class="text-sm text-gray-500 mb-8">
                    Be the trailblazer! Post your very first photo and share it with the world.
                </p>
                <a href="#"
                    class="inline-flex items-center gap-2 rounded-md bg-brand-500 px-5 py-2.5 text-sm font-medium text-white hover:bg-brand-600 transition-colors shadow-sm active:scale-95">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <span>Upload Photo</span>
                </a>
            </div>
        </div>

        <!-- Example Image Card Layout (Commented out until data is available) -->
        <!--
        <div class="group relative aspect-[4/3] overflow-hidden rounded-xl bg-gray-100 shadow-sm hover:shadow-md transition-all duration-300">
            <img src="your-image-url.jpg" alt="Nature" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        </div>
        -->
    </div>
</div>
{% endblock %}
